name: Browser compatibility smoke test

on:
  push:
    branches:
      - feat/browser-compatibility-foundation
  pull_request:
    branches:
      - main

jobs:
  web-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run web:export
